strategies:
  - name: "擒龙猎手"
    short: "擒龙"
    workspace: "%SCRIPT_DIR%/strategies/ql_dragon"
    csv_path: "reports/latest_scan.csv"
    fields:
      ts_code: "ts_code"
      name: "name"
      score: "score"
      industry: "industry"
      concept: "concept_tags"
    score_range: [0, 10]
    extra_cols:
      - { src: "s_theme",        label: "题材分" }
      - { src: "s_technical",    label: "技术分" }
      - { src: "s_fundamental",  label: "基本面" }
      - { src: "circ_mv_yi",    label: "流通市值(亿)" }
      - { src: "turnover_rate",  label: "换手率(%)" }

  - name: "主升行情启动"
    short: "主升"
    workspace: "%SCRIPT_DIR%/strategies/zhush_mainrise"
    csv_path: "dragons_candidates.csv"
    fields:
      ts_code: "ts_code"
      name: "name"
      score: "total_score"
      industry: ~
      concept: "concept"
    score_range: [0, 100]
    extra_cols:
      - { src: "penalty",         label: "超涨扣分" }
      - { src: "gap_unfilled",    label: "缺口" }
      - { src: "limit_up_20d",    label: "涨停次数" }
      - { src: "consecutive_yang", label: "连阳" }
      - { src: "circ_mv(亿)",     label: "流通市值(亿)" }
      - { src: "turnover_rate(%)", label: "换手率(%)" }

  - name: "盘后扫描追随"
    short: "追随"
    workspace: "%SCRIPT_DIR%/strategies/ph_afterclose"
    csv_path: "data/picks_archive.csv"
    md_report: "reports/auto.md"
    html_dashboard: "reports/auto_dashboard.html"
    fields:
      ts_code: "code"
      name: "name"
      score: "total_score"
      industry: ~
      concept: ~
    score_range: [0, 40]
    extra_cols:
      - { src: "量能", label: "量能" }
      - { src: "位置", label: "位置" }
      - { src: "题材", label: "题材" }
      - { src: "人气", label: "人气" }
      - { src: "追随", label: "追随" }
      - { src: "安全", label: "安全" }
      - { src: "tag",  label: "标签" }

  - name: "笔记哥选股"
    short: "笔记哥"
    workspace: "%SCRIPT_DIR%/strategies/bijige"
    csv_path: "output/picks.csv"
    fields:
      ts_code: "ts_code"
      name: "name"
      score: "gain"
      industry: ~
      concept: ~
    score_range: [0, 30]
    extra_cols:
      - { src: "score", label: "涨幅(%)" }
      - { src: "vol_ratio", label: "量比" }
      - { src: "tags", label: "匹配模式" }
